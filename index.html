<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fitness">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Steve's Fitness Tracker</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app">
    <header>
      <h1>Fitness Tracker</h1>
      <p class="subtitle">Balanced Strength • Fitness Connection</p>
    </header>

    <!-- Suggested Workout Banner -->
    <section id="suggestion-panel" class="card">
      <h2>Next Workout Suggestion</h2>
      <div id="suggestion-content">
        <p>Loading suggestion...</p>
      </div>
      <div class="workout-actions">
        <button id="start-suggested-btn" class="btn primary">Start This Workout</button>
        <button id="mark-complete-btn" class="btn secondary" style="display:none;">Mark Workout Complete</button>
      </div>
      <div id="workout-status" class="workout-status"></div>
    </section>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="upper">Upper</button>
      <button class="tab" data-tab="lower">Lower</button>
      <button class="tab" data-tab="core">Core</button>
      <button class="tab" data-tab="aerobic">Aerobic</button>
      <button class="tab" data-tab="history">History</button>
    </nav>

    <!-- Tab Contents -->
    <main>
      <section id="upper" class="tab-content active">
        <h2>Upper Body</h2>
        <div id="upper-exercises" class="exercise-grid"></div>
      </section>

      <section id="lower" class="tab-content">
        <h2>Lower Body</h2>
        <div id="lower-exercises" class="exercise-grid"></div>
      </section>

      <section id="core" class="tab-content">
        <h2>Core & Mobility</h2>
        <div id="core-exercises" class="exercise-grid"></div>
      </section>

      <section id="aerobic" class="tab-content">
        <h2>Aerobic</h2>
        <div id="aerobic-exercises" class="exercise-grid"></div>
      </section>

      <section id="history" class="tab-content">
        <h2>Workout History</h2>
        <div class="history-actions">
          <button id="export-history-btn" class="btn primary">Export History</button>
          <button id="import-history-btn" class="btn secondary">Import History</button>
          <input type="file" id="import-history-file" accept="application/json,.json" style="display:none;">
        </div>
        <div id="history-list"></div>
        <button id="clear-history-btn" class="btn danger">Clear All History</button>
      </section>
    </main>

    <!-- Log Modal -->
    <div id="log-modal" class="modal hidden">
      <div class="modal-content">
        <button class="close-modal">&times;</button>
        <h3 id="modal-title">Log Exercise</h3>
        <img id="modal-img" src="" alt="" class="modal-img">
        <div id="sets-container">
          <!-- Dynamic set inputs -->
        </div>
        <button id="add-set-btn" class="btn secondary">+ Add Set</button>
        <button id="save-log-btn" class="btn primary">Save Log</button>
      </div>
    </div>

    <!-- Add Exercise Modal -->
    <div id="add-exercise-modal" class="modal hidden">
      <div class="modal-content">
        <button class="close-modal">&times;</button>
        <h3>Add Exercise</h3>
        <label class="field-label">Name</label>
        <input type="text" id="add-ex-name" placeholder="e.g. Cable Fly" class="text-input">
        <label class="field-label">Category</label>
        <select id="add-ex-category" class="text-input">
          <option value="upper">Upper Body</option>
          <option value="lower">Lower Body</option>
          <option value="core">Core & Mobility</option>
          <option value="aerobic">Aerobic</option>
        </select>
        <label class="field-label">Brand / Equipment (optional)</label>
        <input type="text" id="add-ex-brand" placeholder="e.g. Life Fitness, Cable, Bodyweight" class="text-input">
        <label class="field-label">Notes (optional)</label>
        <input type="text" id="add-ex-notes" placeholder="Form cue or tip" class="text-input">
        <label class="field-label">Photo (optional)</label>
        <input type="file" id="add-ex-file" accept="image/*" class="file-input">
        <img id="add-ex-preview" class="modal-img" style="display:none;margin-top:8px;">
        <p style="font-size:0.8rem;color:var(--muted);margin:8px 0;">New exercises default to 3 sets when logging.</p>
        <button id="save-new-exercise-btn" class="btn primary" style="width:100%;margin-top:8px;">Save Exercise</button>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
